<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ColorMe</title>
  <link rel="stylesheet" href="Dash.css">
  <link rel="stylesheet" href="dashAnim.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/images/color-wheel-guide-isolated-on-transparent-vector-48630416.webp">
  <style>

    .dashboard-header {
        margin-bottom: 3rem;
        text-align: center;
    }

    .dashboard-header h1 {
        font-size: 2.5rem;
        color: #333;
        margin-bottom: 0.5rem;
    }

    .dashboard-header h2 {
        font-size: 1.5rem;
        color: #666;
        font-weight: normal;
    }

    .action-container {
        display: flex;
        justify-content: center;
        gap: 30px;
        flex-wrap: wrap;
        margin-bottom: 40px;
    }

    .action-box {
        background-color: white;
        width: 300px;
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        text-decoration: none;
        color: inherit;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1px solid #eee;
        cursor: pointer;
    }

    .action-box:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        border-color: #a1c4fd;
    }

    .icon-circle {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        color: white;
        margin-bottom: 20px;
    }

    .action-box h3 {
        margin: 0 0 10px 0;
        font-size: 1.4rem;
        font-weight: 600;
        color: #333;
    }

    .action-box p {
        margin: 0;
        color: #888;
        font-size: 1rem;
        line-height: 1.5;
        text-align: center;
    }

    .results-container {
        margin-top: 20px;
        padding: 20px;
        max-width: 1000px;
        margin-left: auto;
        margin-right: auto;
    }
    
    .result-card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        text-align: left;
    }

    .card-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        border-top: 1px solid #eee;
        padding-top: 15px;
    }

    .action-btn {
        padding: 8px 15px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: all 0.3s ease;
        border: none;
    }

    .btn-export { background-color: #eef2ff; color: #667eea; }
    .btn-export:hover { background-color: #dce4ff; }

    .btn-view { background-color: #f0fdf4; color: #22c55e; }
    .btn-view:hover { background-color: #dcfce7; }

    .btn-delete { background-color: #fff1f2; color: #f43f5e; }
    .btn-delete:hover { background-color: #ffe4e6; }

    .no-results {
        text-align: center;
        padding: 40px;
        color: #666;
        background: white;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
  </style>
</head>

<body class="sb-decor BG-image">
  <aside class="sidebar">
    <nav>
      <ul>
        <li>
          <a href="#" class="active">
            <i class="bx bx-home-circle"></i>
            <span>Dashboard</span>
          </a>
        </li>
        
        <li>
          <a href="settings.html">
            <i class="bx bx-cog"></i>
            <span>Settings</span>
          </a>
        </li>
        <li>
          <a href="#" id="logout-link">
            <i class="bx bx-log-out"></i>
            <span>Log out</span>
          </a>
        </li>
        <li>
          <a href="#" data-resize-btn>
            <i class="bx bx-chevrons-right"></i>
            <span>Collapse</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <main>
    <div class="dashboard-header">
        <h1>ColorMe Dashboard</h1>
        <h2 id="welcome-message">Welcome back!</h2>
    </div>

    <div class="action-container">
        
        <a href="index.html" class="action-box">
            <div class="icon-circle" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                <i class="bx bx-plus"></i>
            </div>
            <h3>Start New Report</h3>
            <p>Upload a new photo to analyze your seasonal colors.</p>
        </a>

        <div class="action-box" onclick="scrollToResults()">
            <div class="icon-circle" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                <i class="bx bx-history"></i>
            </div>
            <h3>View Saved Reports</h3>
            <p>Look back at your previous color analysis history.</p>
        </div>

    </div>

    <div id="loading" style="display: none; text-align: center; margin: 20px;">
        <p>Loading your results...</p>
    </div>

    <div id="results-container" class="results-container"></div>
  </main>

  <script>
    const BACKEND_URL = "http://127.0.0.1:5001";

    // Sidebar functionality
    const resizeBtn = document.querySelector('[data-resize-btn]');
    resizeBtn.addEventListener('click', function(e) {
      e.preventDefault();
      document.body.classList.toggle('sb-decor');
    });

    // Logout functionality
    document.getElementById('logout-link').addEventListener('click', (e) => {
      e.preventDefault();
      sessionStorage.removeItem('loggedInUser');
      localStorage.removeItem('username');
      window.location.href = '/';
    });

    // Page Load Logic
    window.addEventListener('DOMContentLoaded', () => {
      const loggedInUser = sessionStorage.getItem('loggedInUser');
      const username = localStorage.getItem('username');

      if (!loggedInUser && !username) {
        window.location.href = '/Login page.html';
        return;
      }

      const welcomeMessage = document.getElementById('welcome-message');
      welcomeMessage.textContent = `Welcome back, ${username || loggedInUser}!`;

      loadUserResults();
    });

    function scrollToResults() {
        const container = document.getElementById('results-container');
        container.scrollIntoView({ behavior: 'smooth' });
    }

    async function loadUserResults() {
      const loading = document.getElementById('loading');
      const resultsContainer = document.getElementById('results-container');
      const username = localStorage.getItem('username') || sessionStorage.getItem('loggedInUser');

      loading.style.display = 'block';
      resultsContainer.innerHTML = '';

      try {
        const response = await fetch(`${BACKEND_URL}/user/results`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username })
        });

        const data = await response.json();
        loading.style.display = 'none';

        if (response.ok && data.results && data.results.length > 0) {
          displayResults(data.results);
        } else {
          displayNoResults();
        }

      } catch (error) {
        console.error('Error loading results:', error);
        loading.style.display = 'none';
        displayNoResults();
      }
    }

    function displayResults(results) {
      const container = document.getElementById('results-container');
      container.innerHTML = `<h2 style="text-align: center; color: #333; margin-bottom: 30px;">Color Analysis History</h2>`;

      // Show newest first
      results.reverse().forEach((result, index) => {
        const date = new Date(result.timestamp).toLocaleDateString();
        const card = document.createElement('div');
        card.className = 'result-card';
        
        let colorHtml = '';
        if(result.colors) {
            colorHtml = `
            <div style="display: flex; gap: 20px; margin-top: 15px; align-items: center;">
                <div style="text-align: center;">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background:${result.colors.skin}; border: 2px solid #eee; margin: 0 auto;"></div>
                    <p style="font-size: 12px; margin-top: 5px; color: #666;">Skin</p>
                </div>
                <div style="text-align: center;">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background:${result.colors.hair}; border: 2px solid #eee; margin: 0 auto;"></div>
                    <p style="font-size: 12px; margin-top: 5px; color: #666;">Hair</p>
                </div>
                <div style="text-align: center;">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background:${result.colors.eyes}; border: 2px solid #eee; margin: 0 auto;"></div>
                    <p style="font-size: 12px; margin-top: 5px; color: #666;">Eyes</p>
                </div>
            </div>`;
        }

        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">
            <h3 style="margin: 0; color: #333;">${result.season} Season</h3>
            <span style="color: #888; font-size: 0.9rem;">${date}</span>
          </div>
          <p><strong>Undertone:</strong> ${result.undertone}</p>
          <p style="color: #666;">${result.message}</p>
          ${colorHtml}
          
          <div class="card-actions">
            <button class="action-btn btn-export" onclick="alert('Export feature coming soon!')">
                <i class='bx bx-export'></i> Export
            </button>
            <button class="action-btn btn-view" onclick="alert('View details feature coming soon!')">
                <i class='bx bx-show'></i> View Details
            </button>
            <button class="action-btn btn-delete" onclick="alert('Delete feature coming soon!')">
                <i class='bx bx-trash'></i> Delete
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function displayNoResults() {
      document.getElementById('results-container').innerHTML = `
        <div class="no-results">
          <i class="bx bx-palette" style="font-size: 48px; color: #ddd; margin-bottom: 15px;"></i>
          <h3>No Saved Reports Yet</h3>
          <p>Your analysis history will appear here once you start.</p>
        </div>
      `;
    }
  </script>
</body>
</html>
