<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="Dash.css">
   <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/x-icon" href="/images/color-wheel-guide-isolated-on-transparent-vector-48630416.webp">
</head>
<body class="BG-image"></body>
<body class="sb-decor">
  <aside class="sidebar">
    <nav>
      <ul>
        <li>
          <a href="settings.html">
            <i class="bx bx-cog"></i>
            <span>Settings</span>
          </a>
        </li>
        <li>
          <a href="#" id="logout-link">
            <i class="bx bx-log-out"></i>
            <span>Log out</span>
          </a>
        </li>
        <li>
          <a href="#" data-resize-btn>
            <i class="bx bx-chevrons-right"></i>
            <span>Collapse</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>
  <div class="greeting">
    <h1>ColorMe Dashboard</h1>
    <p>Let's start a ColorMe report</p>
  </div>
    <div class="selection">
      <a href="#">Start new report</a>
      <a href="#">View previous report</a>
    </div>
      <span></span>
    </nav>
    <table id="myTable">
        <tr class="header">
          <th style="width: 60%">Recent reports</th>
          <th style="width: 40%">Date created</th>
        </tr>
      </table>
  <script>
      const resizeBtn = document.querySelector('[data-resize-btn]');
      resizeBtn.addEventListener('click', function(e) {
        e.preventDefault();
        document.body.classList.toggle('sb-decor');
      });

      document.getElementById('logout-link').addEventListener('click', (e) => {
        e.preventDefault();
        sessionStorage.removeItem('loggedInUser');
        window.location.href = '/';
      });
    </script>
</body>
</html>
