 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="/images/x-icon" href="color-wheel-guide-isolated-on-transparent-vector-48630416.webp">
    <title>ColorMe Login</title>
    <style>
        .pending-results {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .pending-results h4 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        .pending-results p {
            margin: 5px 0;
            font-size: 14px;
        }

        .success-message {
            background: #4caf50;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .error-message {
            background: #f44336;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        button[type="submit"]:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="center-login">
    <div class="wrapper">
        <br>
        <h1>ColorMe Login</h1>

        <!-- Display pending results if they exist -->
        <div id="pending-results-display" class="pending-results">
            <h4>✨ Your Analysis Results Will Be Saved:</h4>
            <p id="pending-season"></p>
            <p id="pending-undertone"></p>
        </div>

        <!-- Success message -->
        <div id="success-message" class="success-message"></div>

        <!-- Error message -->
        <div id="error-message" class="error-message" style="display: none;">
            <p>Incorrect username or password.</p>
        </div>

        <form id="loginForm">
            <div class="sec-pg-login-container">
                <div class="username-style">
                    <input type="text" id="fname" name="username" placeholder="Username" required>
                </div>
                <div class="password-style">
                    <input type="password" id="lname" name="password" placeholder="Password" required>
                </div>
                <button type="submit" id="login-btn">Login</button>
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                <p><a href="index.html">← Back to Home</a></p>
            </div>
        </form>
    </div>

    <script>
        const BACKEND_URL = "http://127.0.0.1:5001";

        document.addEventListener('DOMContentLoaded', () => {
            // Check for URL parameters
            const params = new URLSearchParams(window.location.search);
            
            // Show error if login failed
            if (params.has('error')) {
                const errorMessage = document.getElementById('error-message');
                errorMessage.style.display = 'block';
            }

            // Check for pending results
            const pendingResults = sessionStorage.getItem('pendingResults');
            if (pendingResults) {
                try {
                    const results = JSON.parse(pendingResults);
                    displayPendingResults(results);
                } catch (error) {
                    console.error('Error parsing pending results:', error);
                }
            }
        });

        function displayPendingResults(results) {
            const displayDiv = document.getElementById('pending-results-display');
            const seasonP = document.getElementById('pending-season');
            const undertoneP = document.getElementById('pending-undertone');

            seasonP.textContent = `🌸 Season: ${results.season}`;
            undertoneP.textContent = `🎨 Undertone: ${results.undertone}`;

            displayDiv.style.display = 'block';
        }

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const loginBtn = document.getElementById('login-btn');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');

            // Hide previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            // Disable button
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            // Get form data
            const username = document.getElementById('fname').value;
            const password = document.getElementById('lname').value;

            // Get pending results from sessionStorage
            const pendingResults = sessionStorage.getItem('pendingResults');
            let analysisResults = null;
            
            if (pendingResults) {
                try {
                    analysisResults = JSON.parse(pendingResults);
                } catch (error) {
                    console.error('Error parsing results:', error);
                }
            }

            // Prepare login data
            const loginData = {
                username: username,
                password: password,
                analysis_results: analysisResults
            };

            try {
                const response = await fetch(`${BACKEND_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(loginData)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Store auth token and user info
                    localStorage.setItem('authToken', data.token || 'temp_token');
                    localStorage.setItem('userId', data.user_id || username);
                    localStorage.setItem('username', data.username || username);
                    sessionStorage.setItem('loggedInUser', username);

                    // Clear pending results
                    sessionStorage.removeItem('pendingResults');

                    // Show success message
                    successMessage.textContent = '✅ Login successful! Redirecting to dashboard...';
                    successMessage.style.display = 'block';

                    // Redirect to dashboard after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = '/Dashboard.html';
                    }, 1500);

                } else {
                    // Show error
                    errorMessage.textContent = data.message || 'Incorrect username or password.';
                    errorMessage.style.display = 'block';
                    
                    // Re-enable button
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }

            } catch (error) {
                console.error('Error during login:', error);
                errorMessage.textContent = 'Network error. Please check if the backend server is running.';
                errorMessage.style.display = 'block';

                // Re-enable button
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
