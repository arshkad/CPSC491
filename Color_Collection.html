<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Col_Collec.css"">
    <title>Document</title>
</head>
<body>
    <main>
         <div class="Greetings">
            <h1>Your color reports, stored here!</h1>
         </div>
    </main>

    <script>
        const list = document.getElementById(reportList);
        let reports = JSON.parse(localStorage.getItem('reports')) || [];
        function makeReport() {
            list.innerHTML ='';
            if (reports.length === 0) {
                const noReports = document.createElement('p');
                noReports.className = 'No-report-message';
                noReports.textContent = "Oh no! There's no color reports! Make one now";
                list.appendChild(noReports);
            }
        }
    </script>
</body>
</html>
